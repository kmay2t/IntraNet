<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <script src="/js/theme.js?v=20261119e"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hoja de movimiento — Intranet meditechnosys</title>
  <link rel="stylesheet" href="/css/panel.css?v=20261123a" />
  <style>
    body { background: var(--fondo, #eef1f6); }
    .barra-hoja {
      position: sticky; top: 0; z-index: 5;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      padding: 10px 16px; background: var(--azul, #1f3864); color: #fff;
    }
    .barra-hoja h1 { font-size: 1rem; margin: 0 auto 0 0; font-weight: 600; }
    .barra-hoja button {
      padding: 7px 14px; border: 1px solid rgba(255,255,255,.5);
      background: rgba(255,255,255,.12); color: #fff; border-radius: 6px;
      cursor: pointer; font-size: .85rem;
    }
    .barra-hoja button:hover { background: rgba(255,255,255,.24); }
    .aviso { padding: 24px; text-align: center; color: var(--suave, #556); }
    .marco {
      max-width: 820px; margin: 22px auto; background: #fff; padding: 28px 34px;
      box-shadow: 0 2px 14px rgba(0,0,0,.12); border-radius: 4px;
    }
    /* El HTML del servidor ya trae su propio estilo institucional; lo dejamos fluir. */
    .marco h1 { font-size: 16px; text-align: center; margin: 6px 0; }
    .marco p { margin: 8px 0; }
    .marco table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    .marco td, .marco th { border: 1px solid #000; padding: 6px; font-size: 12px; vertical-align: top; }
    .marco th { background: #eee; text-align: left; }
    .marco .firmas { margin-top: 26px; }
    .marco .firmas td { border: none; padding: 2px 4px; }
    .marco .firma { height: 60px; vertical-align: bottom; }
    .marco .sep { width: 16px; }
    @media print {
      .barra-hoja { display: none; }
      body { background: #fff; }
      .marco { box-shadow: none; margin: 0; max-width: none; padding: 0; border-radius: 0; }
    }
  </style>
  <link rel="stylesheet" href="/css/theme.css?v=20261120f" />
</head>
<body class="theme-panel">
  <div class="barra-hoja">
    <h1 id="titulo">Hoja de movimiento</h1>
    <button type="button" id="btnWord">Descargar Word</button>
    <button type="button" id="btnImprimir">Imprimir / PDF</button>
    <button type="button" id="btnCerrar">Cerrar</button>
  </div>
  <div id="zona"><p class="aviso">Cargando hoja…</p></div>

  <script src="/js/gestion.js?v=20261123a"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var id = params.get('id');
      var zona = document.getElementById('zona');
      var titulo = document.getElementById('titulo');

      function error(msg) {
        zona.innerHTML = '<p class="aviso"></p>';
        zona.querySelector('.aviso').textContent = msg;
      }

      if (!id) { error('Falta el identificador del movimiento.'); return; }

      // La hoja se sirve ya renderizada desde el servidor (misma plantilla que el Word),
      // así no hay dos versiones que puedan divergir.
      fetch('/api/almacen/movimientos/' + encodeURIComponent(id) + '/hoja', { credentials: 'same-origin' })
        .then(function (r) {
          if (!r.ok) return r.json().catch(function () { return {}; }).then(function (e) {
            throw new Error(e && e.error ? e.error : 'No se pudo cargar la hoja (HTTP ' + r.status + ').');
          });
          return r.text();
        })
        .then(function (html) {
          // El servidor devuelve un documento completo; extraemos solo el <body> para incrustarlo.
          var solo = html;
          var m = /<body[^>]*>([\s\S]*)<\/body>/i.exec(html);
          if (m) solo = m[1];
          var marco = document.createElement('div');
          marco.className = 'marco';
          marco.innerHTML = solo;
          zona.innerHTML = '';
          zona.appendChild(marco);
          var h1 = marco.querySelector('h1');
          if (h1) { titulo.textContent = h1.textContent; document.title = h1.textContent + ' — Intranet meditechnosys'; }
        })
        .catch(function (e) { error(e.message || 'Error al cargar la hoja.'); });

      document.getElementById('btnImprimir').addEventListener('click', function () { window.print(); });
      document.getElementById('btnWord').addEventListener('click', function () {
        Gestion.descargar('/api/almacen/movimientos/' + encodeURIComponent(id) + '/word');
      });
      document.getElementById('btnCerrar').addEventListener('click', function () { window.close(); });
    })();
  </script>
</body>
</html>
